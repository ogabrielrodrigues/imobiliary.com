openapi: 3.1.0

info:
  title: docgen API
  version: "1.0.0"
  summary: Generates standardised DOCX documents from user-uploaded templates.
  description: |
    Upload a `.docx` containing `{{.placeholder}}` markers. The service discovers
    the placeholder schema, renders documents against it, and serves the result
    for download.

    ## Authentication

    Two credentials make up a session.

    The **access token** is a short-lived JWT sent as `Authorization: Bearer
    <token>`. It is validated without touching the database, so it cannot be
    revoked before it expires — hence the short lifetime, 15 minutes by default.

    The **refresh token** is an opaque secret, stored only as a digest, and
    **rotated on every use**: each call to `/v1/auth/refresh` consumes the
    secret and returns a new one. Presenting a secret that was already consumed
    means two parties hold it, and there is no way to tell the owner from a
    thief, so every session of that account is revoked. Always replace the
    stored secret with the one the response returns.

    ## Rate limiting

    Three layers, all answering `429` with a `Retry-After` header in seconds:

    - a global limit per client IP, applied to every request;
    - a strict limit per client IP on `/v1/auth/*`, which is what makes password
      guessing impractical;
    - a limit per account on uploading a template and generating a document.

    Because the global layer covers everything, any endpoint may answer `429`.

    ## Errors

    Every failure uses one shape, so a client needs a single error path. The
    `code` field is stable and safe to branch on; `message` is prose and may be
    reworded. Only validation failures carry `fields`.

    Note that `401` deliberately collapses several causes — bad password,
    expired token, revoked session, replayed refresh secret — into one response.
    Distinguishing them would tell an attacker whether a stolen credential had
    been genuine.
  license:
    name: Unlicensed

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Liveness.
  - name: Authentication
    description: Accounts and sessions.
  - name: Templates
    description: Uploaded DOCX models and their immutable versions.
  - name: Documents
    description: Rendered documents.
  - name: Dashboard
    description: Aggregate figures about the account's own activity.
  - name: Privacy
    description: |
      The rights a data subject has over their own data under the LGPD
      (Lei 13.709/2018): access and portability through the export, erasure
      through the deletes.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness check
      description: Reports whether the database is reachable. Public.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The service can serve traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required: [status]
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: A dependency is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Create an account
      description: |
        Creates an account. It does **not** start a session: call
        `/v1/auth/login` afterwards.

        The email is lowercased and trimmed before the uniqueness check, so
        `Ada@Example.com` and `ada@example.com` are the same account.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: |
            Accepted. The same answer is given whether or not the address
            already had an account; in that case nothing is created and the
            owner is told by email. Anything that differed would reveal who
            is registered.
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Exchange credentials for a session
      description: |
        An unknown address and a wrong password fail identically, in the same
        response and in the same amount of time, so the endpoint cannot be used
        to discover which addresses are registered.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: A new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the token pair
      description: |
        Consumes the refresh secret and returns a fresh pair. **Replace both
        stored tokens with the ones returned**: the secret just sent is now
        spent.

        Sending a spent secret is treated as evidence that it leaked, and
        revokes every session of the account — including the successor a
        legitimate client is holding. That collateral damage is deliberate.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: A rotated session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: |
            The secret is unknown, expired, revoked, or was already consumed.
            The response is identical in every case.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: End a session
      description: |
        Revokes the session the secret belongs to. Answers `204` whether or not
        the secret matched a live session: the caller's intent is satisfied
        either way, and a different answer for an unknown secret would let the
        endpoint be used to probe for valid ones.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: The session is gone.
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Ask for a password-reset link
      description: |
        Mails a one-time link to the address, if it belongs to an account.

        Always answers 202, and always the same. Reporting whether the
        address was found would turn an endpoint anyone can reach into a way
        to ask which addresses are registered here.
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "202":
          description: |
            The request was accepted. This says nothing about whether a
            message was sent.
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password/reset:
    post:
      tags: [Authentication]
      summary: Set a password from a reset link
      description: |
        Consumes the token from the mail and sets a new password.

        The token works once and expires. Every session of the account ends,
        including any the caller holds: whoever presents this proved control
        of the mailbox and nothing more, and the premise of the flow is that
        the account may already be in someone else's hands.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 256 }
              required: [token, new_password]
      responses:
        "204":
          description: The password was set.
        "401":
          description: |
            The token is unknown, expired or already used. The three are not
            told apart.
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me:
    get:
      tags: [Authentication]
      summary: Current account
      operationId: getCurrentUser
      responses:
        "200":
          description: The authenticated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    delete:
      tags: [Privacy]
      summary: Erase the account
      description: |
        Erases the account and everything belonging to it — templates, every
        version, generated documents with the values that were filled into
        them, sessions, and the stored files behind all of it.

        Unlike the delete on a template, this one is not a flag. Nothing
        survives except a stored file whose exact bytes another account also
        holds, which content addressing makes one file rather than two.

        This is the erasure right of article 18, VI of the LGPD. It cannot be
        undone and asks for no confirmation beyond the request itself.
      operationId: deleteAccount
      responses:
        "204":
          description: The account and its data were erased.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/password:
    post:
      tags: [Authentication]
      summary: Change the password
      description: |
        Replaces the password of the authenticated account, and answers with a
        **new session**.

        Every other session of the account ends immediately — not when its
        access token would have lapsed. A change that left a second party
        signed in would be decorative, and that party is the reason anyone
        changes a password. The session returned is what keeps the caller
        working through its own request.

        Charged to the strict per-IP credential budget rather than the write
        one: guessing a password is guessing a password whether or not the
        guesser already holds a session.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 256 }
              required: [current_password, new_password]
      responses:
        "200":
          description: The password changed, and a fresh session was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/export:
    get:
      tags: [Privacy]
      summary: Export everything held about the account
      description: |
        Returns a single JSON document with the account, every template and
        version, and every generated document including the values that were
        filled into it.

        Templates hidden by a soft delete are listed, marked `deleted`: the
        question an access request asks is what is still held, not what is
        still shown.

        The uploaded and rendered `.docx` files are not inlined. Download them
        individually; the export says so in its own `notes` field.

        This serves the access and portability rights of article 18, II and V.
      operationId: exportAccount
      responses:
        "200":
          description: |
            The export, offered as an attachment and marked `no-store`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/stats:
    get:
      tags: [Dashboard]
      summary: Figures behind the account's dashboard
      description: |
        Counts of templates and documents, documents per day across a window,
        and the templates used most in it. Everything is scoped to the caller.

        The window ends today and covers `days` calendar days, counted in the
        time zone `tz`: a document generated at 22:30 in São Paulo belongs to
        that day there, whatever UTC date it was stored under. The window of
        the same length just before it is reported as a single count, which is
        what a change is measured against.

        Deleted templates are left out of the template count but still ranked,
        marked `deleted`: the documents made from them are still the
        account's.
      operationId: getStats
      parameters:
        - name: days
          in: query
          required: false
          description: Length of the window. Only these three are offered.
          schema:
            type: integer
            enum: [7, 30, 90]
            default: 30
        - name: tz
          in: query
          required: false
          description: |
            IANA time zone that decides where each day starts. `Local` is
            refused, since it would mean the server's zone.
          schema:
            type: string
            default: UTC
            example: America/Sao_Paulo
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/templates:
    get:
      tags: [Templates]
      summary: List templates
      description: |
        Newest first. The `version` field is omitted from listed items; fetch a
        single template to see its placeholder schema.
      operationId: listTemplates
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [Templates]
      summary: Upload a template
      description: |
        Creates a template and its first version from an uploaded `.docx`.

        The upload is normalised on the way in: Word routinely splits a
        placeholder across several runs, and a pass reassembles each one before
        the template is compiled. The response reports the placeholders found,
        which is the schema a generation request must satisfy exactly.

        Rejected with `422` if the file is not a valid `.docx`, is missing
        `word/document.xml`, exceeds the size limit, or contains a construct
        outside the accepted placeholder grammar.
      operationId: createTemplate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                  description: Required.
                  examples: ["Service agreement"]
                description:
                  type: string
                  maxLength: 500
                  examples: ["Standard contract template"]
                file:
                  type: string
                  format: binary
                  description: The `.docx` model. Required. Defaults to a 10 MiB limit.
              required: [name, file]
      responses:
        "201":
          description: The template and its first version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateWithVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [Templates]
      summary: Get a template and its schema
      description: |
        `version.placeholders` is the exact set of keys a generation request
        must supply — no more, no fewer.
      operationId: getTemplate
      responses:
        "200":
          description: The template and its latest version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateWithVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Templates]
      summary: Delete a template
      description: |
        A soft delete: the template disappears from the API, but the versions
        behind already-generated documents are retained, so those documents stay
        downloadable.
      operationId: deleteTemplate
      responses:
        "204":
          description: The template was removed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/templates/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [Templates]
      summary: List a template's versions
      description: |
        Newest first. Version numbers are contiguous and could be guessed, but
        the placeholder schema behind each one could not — which is what a
        client needs in order to offer a choice of version rather than only the
        latest.
      operationId: listTemplateVersions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TemplateVersion" }
                required: [items]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    post:
      tags: [Templates]
      summary: Publish a new version
      description: |
        Appends a version. Numbering is allocated by the server, so concurrent
        uploads cannot collide.

        Earlier versions remain usable and are never rewritten, which is what
        keeps a document generated last month reproducible after the template
        has moved on. A generation request can pin one with `version`.
      operationId: addTemplateVersion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The new `.docx` model. Required.
              required: [file]
      responses:
        "201":
          description: The template and its new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateWithVersion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/templates/{id}/versions/{version}/file:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
      - $ref: "#/components/parameters/VersionNumber"
    get:
      tags: [Templates]
      summary: Download a template version
      description: |
        Streams the stored `.docx` of one version.

        This is what lets a client work with a template's content rather than
        only its metadata — rendering a preview of it, or reopening one that was
        authored in an editor.

        The archive returned is the **normalised** one, not the bytes originally
        uploaded: placeholders that Word had split across runs have been pulled
        back together. Parts the service does not template are copied through
        untouched, so an authoring client can embed its own source inside the
        archive and find it here unchanged.

        A published version never changes, so the response is marked immutable.
      operationId: downloadTemplateVersion
      responses:
        "200":
          description: The stored archive.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="Lease agreement-v1.docx"']
            Cache-Control:
              schema:
                type: string
                examples: ["private, max-age=31536000, immutable"]
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "206":
          description: A requested byte range.
        "400":
          description: The identifier is not a UUID, or the version is not a positive integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/documents:
    get:
      tags: [Documents]
      summary: List documents
      description: Newest first.
      operationId: listDocuments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: A page of documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                required: [items]
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [Documents]
      summary: Generate a document
      description: |
        Renders the template with the supplied values and stores the result.
        Generation is synchronous: the document exists by the time the response
        arrives.

        The keys of `data` must match the version's placeholders **exactly**. A
        missing key and an unrecognised key are both `422`, and every problem is
        reported at once. Rejecting unknown keys is deliberate: silently
        dropping a misspelled one would produce a document missing text the
        caller believed it had supplied.

        Values are XML-escaped before substitution, so `&`, `<` and `>` are safe
        to send and appear literally in the finished document.
      operationId: generateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
      responses:
        "201":
          description: The generated document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The template, or the pinned version, does not exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: Get document metadata
      description: |
        Includes the input data and the exact template version used, which
        together make the output reproducible.
      operationId: getDocument
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      tags: [Privacy]
      summary: Erase one generated document
      description: |
        Removes the document, the values that were filled into it, and the
        rendered file — unless another document holds byte-identical content,
        in which case the shared file stays.

        A real delete, not a flag. The template it came from is untouched.
      operationId: deleteDocument
      responses:
        "204":
          description: The document was erased.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/documents/{id}/download:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      summary: Download the rendered .docx
      description: |
        Streams the file. Range and conditional requests are supported.

        A generated document never changes, so the response is marked
        immutable and may be cached indefinitely.
      operationId: downloadDocument
      responses:
        "200":
          description: The document bytes.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="service-agreement.docx"']
            Cache-Control:
              schema:
                type: string
                examples: ["private, max-age=31536000, immutable"]
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "206":
          description: A requested byte range.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` returned by login or refresh.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Values above the maximum are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    TemplateId:
      name: id
      in: path
      required: true
      description: Template identifier.
      schema:
        type: string
        format: uuid
    DocumentId:
      name: id
      in: path
      required: true
      description: Document identifier.
      schema:
        type: string
        format: uuid
    VersionNumber:
      name: version
      in: path
      required: true
      description: Template version number, counting from 1.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: A path identifier is not a valid UUID.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No credential, or one that was not accepted. Carries
        `WWW-Authenticate: Bearer`.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ["Bearer"]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such resource **for this account**. A resource owned by someone else
        is reported as missing rather than forbidden, so the API never confirms
        that an identifier exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: The body was sent under an unexpected `Content-Type`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: |
        The request was well formed but could not be accepted. Every problem
        found is listed in `fields`, so one round trip reveals all of them.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            missingAndMisspelledPlaceholder:
              summary: A field left out and a key that matches no placeholder
              value:
                error:
                  code: validation_failed
                  message: the request could not be processed
                  fields:
                    - field: data.amount
                      message: is required by the template
                    - field: data.paln
                      message: is not used by this template version
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Whole seconds to wait, rounded up.
          schema:
            type: integer
            examples: [5]
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            Length is the only rule. Composition requirements are deliberately
            absent, following current NIST guidance.
        terms_version:
          type: string
          description: |
            The version of the terms of use the account accepted. Required:
            the acceptance is recorded with its version and instant, because
            consent to one version is not consent to the next.
      required: [email, name, password, terms_version]
      examples:
        - email: someone@example.com
          name: Ada Lovelace
          password: a-sufficiently-long-password
          terms_version: "1.0"

    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string }
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: The most recent refresh secret. It is consumed by this call.
      required: [refresh_token]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }
      required: [id, email, name, created_at]
      examples:
        - id: 01a08374-3567-79e9-83a1-ab0c71a3f88e
          email: someone@example.com
          name: Ada Lovelace
          created_at: "2026-09-08T23:57:06.279Z"

    Session:
      type: object
      properties:
        access_token:
          type: string
          description: "Send as the header `Authorization: Bearer <token>`."
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
          description: When the access token stops being accepted.
        refresh_token:
          type: string
          description: |
            Opaque secret. Store it, and replace it on every refresh — it is
            single-use.
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
      required:
        [access_token, token_type, expires_at, refresh_token, refresh_expires_at, user]

    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        latest_version:
          type: integer
          description: The highest version number published.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version:
          description: Present when a single template is fetched; absent in listings.
          anyOf:
            - $ref: "#/components/schemas/TemplateVersion"
            - type: "null"
      required: [id, name, description, latest_version, created_at, updated_at]

    TemplateWithVersion:
      allOf:
        - $ref: "#/components/schemas/Template"
      description: A template whose `version` field is populated.

    TemplateVersion:
      type: object
      description: |
        An immutable snapshot of an uploaded `.docx`. Publishing a change
        creates a new version rather than altering this one.
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        size:
          type: integer
          description: Size in bytes of the stored, normalised archive.
        placeholders:
          type: array
          description: |
            The field names found in the document, sorted. This is the schema a
            generation request must satisfy exactly.
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
        created_at: { type: string, format: date-time }
      required: [id, version, size, placeholders, created_at]
      examples:
        - id: 01a08374-6a08-749d-b6b8-9cd2fa9d2483
          version: 1
          size: 1379
          placeholders: [amount, customer_name, plan]
          created_at: "2026-09-08T23:57:19.752Z"

    GenerateRequest:
      type: object
      properties:
        template_id: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: |
            Pins a template version. Omit to use the latest. Pinning matters
            when a caller must keep producing documents against a schema it has
            already validated against.
        filename:
          type: string
          description: |
            Suggested download name. Sanitised, and given a `.docx` extension if
            it lacks one. Defaults to `document.docx`.
        data:
          type: object
          description: |
            One entry per placeholder. Keys must match the version's
            placeholders exactly.
          additionalProperties:
            type: string
            maxLength: 10000
      required: [template_id, data]
      examples:
        - template_id: 01a08374-6a08-746a-ade6-08aac54590b0
          filename: service-agreement.docx
          data:
            customer_name: Acme & Sons <Ltd>
            plan: Premium
            amount: "1500.00"

    AccountExport:
      type: object
      description: |
        Everything the service holds about one account, at one instant.
      properties:
        exported_at: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/User" }
        templates:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              description: { type: string }
              deleted:
                type: boolean
                description: |
                  True for a template hidden by a soft delete and still
                  stored.
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              versions:
                type: array
                items: { $ref: "#/components/schemas/TemplateVersion" }
            required: [id, name, description, deleted, created_at, updated_at, versions]
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        notes:
          type: object
          additionalProperties: { type: string }
          description: |
            What the export does not contain, stated in the export itself so
            a reader is not left to assume it is everything.
      required: [exported_at, account, templates, documents, notes]

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        template_version:
          type: integer
          description: The version actually used, resolved at generation time.
        filename: { type: string }
        size: { type: integer, description: Size in bytes of the rendered file. }
        data:
          type: object
          description: The values used, retained so the output can be reproduced.
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        download_url:
          type: string
          description: Path to the download endpoint, relative to the server.
      required:
        [id, template_id, template_version, filename, size, data, created_at, download_url]

    FieldError:
      type: object
      properties:
        field:
          type: string
          description: |
            The input that caused the problem. Values inside the generation
            payload are named `data.<placeholder>`.
        message: { type: string }
      required: [field, message]

    Stats:
      type: object
      properties:
        days: { type: integer, enum: [7, 30, 90] }
        time_zone:
          type: string
          description: The zone the days were counted in.
        templates:
          type: integer
          description: Templates not deleted.
        documents:
          type: integer
          description: Every document the account holds.
        documents_in_period:
          type: integer
          description: Documents generated in the window, today included.
        documents_previous_period:
          type: integer
          description: Documents generated in the window of the same length just before.
        per_day:
          type: array
          description: One entry per day of the window, oldest first, zero-filled.
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                description: A calendar day in `time_zone`, not an instant.
              documents: { type: integer }
            required: [date, documents]
        top_templates:
          type: array
          description: Up to five templates, most used in the window first; ties by name.
          items:
            type: object
            properties:
              template_id: { type: string, format: uuid }
              name: { type: string }
              deleted: { type: boolean }
              documents: { type: integer }
            required: [template_id, name, deleted, documents]
      required:
        [days, time_zone, templates, documents, documents_in_period,
         documents_previous_period, per_day, top_templates]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable and safe to branch on.
              enum:
                - validation_failed
                - not_found
                - conflict
                - unauthorized
                - rate_limited
                - bad_request
                - unsupported_media_type
                - internal_error
            message:
              type: string
              description: Prose for a human. May be reworded; do not match on it.
            fields:
              type: array
              description: Present only when `code` is `validation_failed`.
              items: { $ref: "#/components/schemas/FieldError" }
          required: [code, message]
      required: [error]
