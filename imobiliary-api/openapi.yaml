openapi: 3.1.0

info:
  title: Imobiliary API
  version: "0.6.0"
  summary: Rental property management for brokers, small agencies and owners.
  description: |
    The API behind the Imobiliary platform. It covers identity and the office
    (accounts, sessions with a second factor, members and invitations, the
    account holder's rights under the LGPD) and the office's register of
    people and properties. Contracts and rents arrive in later phases.

    ## Offices and roles

    Data belongs to an office (an organisation). An account works inside one
    office at a time and may belong to several. Inside an office it is either
    `admin`, who manages members, invitations and the office itself, or
    `member`. An office is never left without an administrator.

    ## Authentication

    A session is two credentials.

    - The **access token** is a JWT signed with Ed25519, valid for 15 minutes,
      sent as `Authorization: Bearer <token>`. It names the account and the
      office. The membership behind it is read again on every request, so a
      role change or a removal takes effect at once, not when the token
      expires. A token minted before the account's last password change is
      refused.
    - The **refresh token** is an opaque secret exchanged at
      `POST /v1/sessions/refresh` for a new pair. Each one is spent once.
      Presenting a spent one ends every session of the account, because two
      parties hold it and the owner cannot be told from the thief.

    ## The second factor

    TOTP (RFC 6238, 30 seconds, 6 digits, SHA-1). Optional for a member,
    mandatory for an administrator. When an account has it, signing in answers
    with a **challenge** instead of a session, and `POST /v1/sessions/mfa`
    completes it with a code from the app or a recovery code. A challenge
    lasts five minutes and allows one attempt.

    An administrator who has not enrolled yet receives a session flagged
    `mfa_enrollment_required`. That session reaches only the enrolment
    endpoints, `GET /v1/me/export` and `POST /v1/me/deletion`; everything else
    answers `403 mfa_enrollment_required`.

    ## Errors

    Every failure has the same body, `{"error": {"code", "message", "fields"}}`.
    Branch on `code`, which is stable; `message` is prose and may change.
    `fields` appears on `422 validation_failed` and names each input that was
    refused, all at once.

    Several causes deliberately share one answer. A wrong password, an unknown
    address, a spent link, a wrong code, an expired or reused session are all
    `401 unauthorized`. Registration and password recovery answer `202`
    whether or not the address has an account. Telling these apart is what an
    attacker would be asking for.

    ## Office data

    People and properties belong to the office the session works in, and every
    member may manage them. Each request runs in a database transaction scoped to that
    office with row-level security, so another office's rows are never found:
    they answer `404`, as a row that does not exist does.

    Email, phone, CPF, CNPJ and birth date are encrypted at rest. A CPF or CNPJ
    can still be searched exactly, through an index scoped to the office.

    Editing uses optimistic concurrency. A read returns the version in `ETag`;
    `PUT` must send it back in `If-Match`. A missing `If-Match` is `428`, a
    version that is no longer current is `412`: read again and redo the edit.

    ## Limits

    Three token buckets, each answering `429 rate_limited` with `Retry-After`
    in whole seconds:

    - every request, per client address (IPv6 per /64): 10/s, burst 60;
    - endpoints where a secret is guessed, per client address: one every
      5 seconds, burst 10;
    - authenticated writes, per account: 2/s, burst 20.

    Request bodies are limited to 1 MiB.

    ## Conventions

    - Bodies are `application/json`; anything else is `415`. Malformed JSON,
      duplicate member names and trailing data are `400`. Unknown members are
      ignored.
    - Identifiers are UUIDv7 strings. Instants are RFC 3339 with an offset.
    - Every response carries `X-Request-ID`, `Cache-Control: no-store` and
      `X-Content-Type-Options: nosniff`. A valid W3C `traceparent` is carried
      into the logs.
    - The service binds to loopback and speaks plain HTTP. TLS is terminated
      by the proxy in front of it.
  contact:
    name: Imobiliary
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://127.0.0.1:8081
    description: Local development

tags:
  - name: Accounts
    description: Opening an account and recovering a password.
  - name: Sessions
    description: Signing in, the second step, refreshing and signing out.
  - name: Me
    description: The signed-in account.
  - name: Second factor
    description: Enrolling TOTP and managing recovery codes.
  - name: Privacy
    description: The account holder's rights under the LGPD.
  - name: Office
    description: The office the session works in, and its members.
  - name: Invitations
    description: Inviting someone, and joining from the mailed link.
  - name: People
    description: The office's register of individuals and companies.
  - name: Properties
    description: The office's properties, with their owners and shares.
  - name: Contracts
    description: |
      Leases of the office's properties, with their parties, the legal notices
      acknowledged and the schedule of rents.
  - name: Rents
    description: Instalments across contracts, payments, charges and the dashboard.
  - name: Operations
    description: Probes for the orchestrator.

security:
  - bearer: []

paths:
  # --- accounts ---------------------------------------------------------------

  /v1/accounts:
    post:
      tags: [Accounts]
      summary: Open an account and its office
      description: |
        Creates the account and the office it administers, with the account as
        its administrator. The first sign-in will ask for second-factor
        enrolment.

        Answers `202` with no body for any well-formed request, including an
        address that already has an account. The owner of that address is told
        by mail instead. Nobody is signed in by this call.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, organization_name, terms_version]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                name: { type: string, minLength: 1, maxLength: 120 }
                password: { $ref: "#/components/schemas/NewPassword" }
                organization_name: { type: string, minLength: 1, maxLength: 120 }
                terms_version:
                  type: string
                  description: The version of the terms the person accepted.
                  examples: ["1.0"]
      responses:
        "202": { description: "Accepted. Check the mailbox, then sign in." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/password/forgot:
    post:
      tags: [Accounts]
      summary: Ask for a reset link
      description: |
        Mails a link to set a new password, valid for 30 minutes and usable
        once. Always `202`, whether or not the address has an account.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: Accepted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/password/reset:
    post:
      tags: [Accounts]
      summary: Set a new password from the link
      description: |
        Spends the link and replaces the password. Every session of the account
        ends, and any other reset link stops working.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: The secret from the link. }
                password: { $ref: "#/components/schemas/NewPassword" }
      responses:
        "204": { description: The password was set. Sign in with it. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- sessions ---------------------------------------------------------------

  /v1/sessions:
    post:
      tags: [Sessions]
      summary: Sign in
      description: |
        Checks the password. The answer is either a session, or, for an
        account with a second factor, a challenge to complete at
        `POST /v1/sessions/mfa`. Both list the offices the account belongs to.

        Without `organization_id` the session opens in the first office by
        name. Naming an office the account does not belong to is `403`, as is
        an account that belongs to no office any more.
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                organization_id: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: A session, or the challenge for the second factor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

    delete:
      tags: [Sessions]
      summary: Sign out
      description: |
        Revokes the refresh token. Always `204`, whether or not it matched a
        live session. The access token in hand keeps working until it expires,
        at most 15 minutes; a client discards it.
      operationId: signOut
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Signed out. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/mfa:
    post:
      tags: [Sessions]
      summary: Complete a sign-in with the second factor
      description: |
        Spends the challenge, right code or wrong. A refused code means signing
        in again for a new challenge. `code` is the six digits from the app or
        one of the recovery codes; a recovery code is spent too.
      operationId: completeSecondFactor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string }
                organization_id: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/refresh:
    post:
      tags: [Sessions]
      summary: Exchange a refresh token for a new pair
      description: |
        Spends the refresh token and returns a new session in the same office.
        A spent token presented again ends every session of the account. Two
        concurrent requests with one token: one succeeds, the other is `401`.
        A client should share one refresh between its concurrent calls.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/switch:
    post:
      tags: [Sessions]
      summary: Move the session to another office
      description: |
        Spends the refresh token and returns a session in the named office,
        which the account must belong to.
      operationId: switchOrganization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, organization_id]
              properties:
                refresh_token: { type: string }
                organization_id: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: The session in the other office.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- me ---------------------------------------------------------------------

  /v1/me:
    get:
      tags: [Me]
      summary: The signed-in account
      operationId: getMe
      responses:
        "200":
          description: The account, where it works and what it may do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/password:
    post:
      tags: [Me]
      summary: Change the password
      description: |
        Replaces the password for someone who knows the current one. **Every
        session ends, this one included**: the access token that made this
        request is refused from now on, so the client signs in again. The
        account's address is told by mail.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { $ref: "#/components/schemas/NewPassword" }
      responses:
        "204": { description: Changed. Sign in again. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- second factor ----------------------------------------------------------

  /v1/me/totp:
    post:
      tags: [Second factor]
      summary: Start enrolment
      description: |
        Generates a secret and stores it unconfirmed. Nothing changes for
        signing in until `POST /v1/me/totp/confirm` proves a code from it.
        Starting again replaces the previous attempt; an account whose second
        factor is already on gets `409`. Reachable by a session that still owes
        enrolment.
      operationId: startEnrollment
      responses:
        "200":
          description: The secret, as base32 and as an otpauth URI for a QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret: { type: string, examples: ["JBSWY3DPEHPK3PXP"] }
                  uri:
                    type: string
                    description: An `otpauth://totp/` address with the issuer and the account's email in its label.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

    delete:
      tags: [Second factor]
      summary: Turn the second factor off
      description: An administrator may not; that is `403 forbidden`.
      operationId: disableSecondFactor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Turned off. The recovery codes are gone too. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp/confirm:
    post:
      tags: [Second factor]
      summary: Confirm enrolment with a code
      description: |
        Proves a code from the app and turns the second factor on. The step of
        the accepted code is recorded, so the next code must come from a later
        step. The ten recovery codes in the response exist in readable form
        only here; the service keeps their digests.

        `409` when there is no enrolment to confirm.
      operationId: confirmEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: On, with the recovery codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/totp/recovery-codes:
    post:
      tags: [Second factor]
      summary: Replace the recovery codes
      description: |
        Issues ten new codes. The previous list stops working. `409` when the
        second factor is off.
      operationId: regenerateRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: The new codes, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- privacy ----------------------------------------------------------------

  /v1/me/export:
    get:
      tags: [Privacy]
      summary: A copy of the account's data
      description: |
        The access right of LGPD art. 18, II: the account, its memberships,
        the second-factor state, stored sessions, invitations received, the
        audit events the account acted in and its access records, oldest first.

        No secret is included: no password hash, TOTP secret, token or code
        digest. The export is recorded in the audit trail. Reachable by a
        session that still owes enrolment; charged to the write budget.
      operationId: exportAccount
      responses:
        "200":
          description: The copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/deletion:
    post:
      tags: [Privacy]
      summary: Delete the account
      description: |
        The erasure right of LGPD art. 18, VI, confirmed with the password.
        Immediate and permanent. A POST with a body, rather than a DELETE on
        `/v1/me`, because proxies may drop the body of a DELETE.

        **Erased:** the account, its memberships, sessions, second factor,
        recovery codes and pending resets. An office whose only member is this
        account is erased with it.

        **Kept, as the law requires:** the access records (Marco Civil art. 15)
        keep the account's identifier, and the account's address is kept
        sealed with the field key so they still identify someone. Both are
        purged six months after the deletion (LGPD art. 16, I). The audit
        trail keeps its entries without the actor; each office the account
        belonged to gets a `user.deleted` entry.

        **Refused** with `422` on `organizations` while the account is the only
        administrator of an office that has other members. Make someone else an
        administrator first. Also refused, with `422` on `organization_data`,
        when an office whose only member is this account still holds people:
        an office's data is never erased as a side effect of closing an account.

        Reachable by a session that still owes enrolment. Charged to both the
        credential limit and the write budget. The address is mailed afterwards.
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "204": { description: Deleted. Every credential the client holds is now refused. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- office -----------------------------------------------------------------

  /v1/organization:
    get:
      tags: [Office]
      summary: The office the session works in
      operationId: getOrganization
      responses:
        "200":
          description: The office.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

    patch:
      tags: [Office]
      summary: Rename the office
      description: Administrators only.
      operationId: renameOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "204": { description: Renamed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/organization/members:
    get:
      tags: [Office]
      summary: Who works in the office
      description: Every member may read it. Ordered by name.
      operationId: listMembers
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/organization/members/{userID}:
    parameters:
      - name: userID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    patch:
      tags: [Office]
      summary: Change a member's role
      description: |
        Administrators only. Demoting the last administrator is `422` on
        `role`. A demotion applies to the member's open session at once.
      operationId: changeRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Office]
      summary: Remove a member
      description: |
        Administrators only. Ends the member's sessions; their account remains
        and may belong to other offices. Removing yourself is `409`; removing
        the last administrator is `422` on `role`.
      operationId: removeMember
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- invitations ------------------------------------------------------------

  /v1/organization/invitations:
    get:
      tags: [Invitations]
      summary: The office's invitations
      description: Administrators only. Newest first, every status.
      operationId: listInvitations
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Invitations]
      summary: Invite someone
      description: |
        Administrators only. Mails a link valid for seven days. The secret is
        never in this response. An address with an invitation already pending
        in this office is `409`.
      operationId: invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/organization/invitations/{invitationID}:
    delete:
      tags: [Invitations]
      summary: Revoke an invitation
      description: |
        Administrators only. Only a pending invitation can be revoked; one that
        was accepted, revoked or belongs to another office is `404`.
      operationId: revokeInvitation
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ID" }
      responses:
        "204": { description: Revoked. The link no longer works. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/invitations/lookup:
    post:
      tags: [Invitations]
      summary: Read an invitation by its link
      description: |
        For the screen that shows who is inviting whom. A POST with the secret
        in the body, not in a path that logs and history would keep. A link
        that is unknown, spent, revoked or expired is `401`.
      operationId: lookupInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingInvitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/invitations/accept:
    post:
      tags: [Invitations]
      summary: Join from the link
      description: |
        Joins the office with the invitation's role, once. When the address has
        no account, `name`, `password` and `terms_version` create one; when it
        has, they are ignored. No session is returned: sign in afterwards.
      operationId: acceptInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                name: { type: string, minLength: 1, maxLength: 120 }
                password: { $ref: "#/components/schemas/NewPassword" }
                terms_version: { type: string }
      responses:
        "204": { description: Joined. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- people -----------------------------------------------------------------

  /v1/people:
    get:
      tags: [People]
      summary: Search the office's people
      description: |
        Alphabetical, ignoring case and accents, paged with `next_cursor`.
        A `q` that is a valid CPF or CNPJ, formatted or not, finds that
        document exactly; any other `q` matches a fragment of the name, so
        "joao" finds "João Silva". Rows carry no sealed field.
      operationId: listPeople
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/PersonKind" } }
        - name: limit
          in: query
          description: Default 20, at most 100.
          schema: { type: integer, minimum: 1 }
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema: { type: string }
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items: { $ref: "#/components/schemas/PersonSummary" }
                  next_cursor:
                    type: string
                    description: Absent on the last page.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [People]
      summary: Register a person
      description: |
        Naming a `spouse_id` writes the link on the spouse's record too, which
        increments the spouse's version. The spouse must be an individual
        registered as married or in a stable union and not linked to someone
        else. Representatives must be individuals. A CPF or CNPJ already
        registered in the office is `422` on that field.
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonInput" }
      responses:
        "201":
          description: Registered.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/people/{personID}:
    parameters:
      - name: personID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    get:
      tags: [People]
      summary: Read a person
      operationId: getPerson
      responses:
        "200":
          description: The person, sealed fields opened.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [People]
      summary: Replace a person
      description: |
        The whole record, addresses and representatives included, as of the
        version in `If-Match`. The kind cannot change. Clearing or replacing
        `spouse_id` clears the link on the former spouse's record.
      operationId: updatePerson
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The `ETag` of the read the edit is based on, such as `"3"`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonInput" }
      responses:
        "200":
          description: Replaced.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [People]
      summary: Delete a person
      description: |
        Permanent, with the person's addresses, and recorded in the audit trail
        without values. Refused with `409 in_use` while something links to
        the person, such as a company they represent or a property they own. A spouse keeps their
        record and loses the link.
      operationId: deletePerson
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- properties -------------------------------------------------------------

  /v1/properties:
    get:
      tags: [Properties]
      summary: Search the office's properties
      description: |
        Ordered by street and number, ignoring case and accents, paged with
        `next_cursor`. `q` matches a fragment of the street, district or city,
        or of the registry or municipal registration. `owner_id` keeps the
        properties that person owns a share of.
      operationId: listProperties
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: owner_id, in: query, schema: { $ref: "#/components/schemas/ID" } }
        - name: limit
          in: query
          description: Default 20, at most 100.
          schema: { type: integer, minimum: 1 }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [properties]
                properties:
                  properties:
                    type: array
                    items: { $ref: "#/components/schemas/PropertySummary" }
                  next_cursor: { type: string, description: Absent on the last page. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Properties]
      summary: Register a property
      description: |
        At least one owner, each a person of this office, with shares that add
        up to exactly 100. Shares are percentages with up to four decimal
        places, so a property split in three is `33.3333`, `33.3333` and
        `33.3334`. The database checks the sum again when the transaction
        commits.
      operationId: createProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "201":
          description: Registered.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/properties/{propertyID}:
    parameters:
      - name: propertyID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    get:
      tags: [Properties]
      summary: Read a property
      operationId: getProperty
      responses:
        "200":
          description: The property with its owners named.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Properties]
      summary: Replace a property
      description: |
        The whole record, owners included, as of the version in `If-Match`.
        The address keeps its identity; only its lines change.
      operationId: updateProperty
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The `ETag` of the read the edit is based on.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyInput" }
      responses:
        "200":
          description: Replaced.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Properties]
      summary: Delete a property
      description: |
        Permanent, with its owners' shares and its address, audited without
        values. Once contracts exist, refused with `409 in_use` while one
        names the property.
      operationId: deleteProperty
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts:
    get:
      tags: [Contracts]
      summary: Search the office's contracts
      description: |
        Newest start first, paged with `next_cursor`. `q` matches a fragment of
        the registry, the property's street or a party's name, ignoring case
        and accents. `status` is computed against today in America/Sao_Paulo.
      operationId: listContracts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: property_id, in: query, schema: { $ref: "#/components/schemas/ID" } }
        - { name: person_id, in: query, description: Contracts naming this person in any role., schema: { $ref: "#/components/schemas/ID" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ContractStatus" } }
        - name: limit
          in: query
          description: Default 20, at most 100.
          schema: { type: integer, minimum: 1 }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [contracts]
                properties:
                  contracts:
                    type: array
                    items: { $ref: "#/components/schemas/ContractSummary" }
                  next_cursor: { type: string, description: Absent on the last page. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Contracts]
      summary: Register a contract
      description: |
        Creates the contract and its schedule: one instalment per month of the
        term, on `due_day` (the month's last day when shorter). With
        `advance_rent` the first is due on `starts_on` and each month is paid
        at its start; without it each month is paid on the due day of the
        month after it. With no landlord among the
        parties, the property's owners become the landlords.

        A property holds one contract per period; an overlap is refused on
        `starts_on`. Each notice the terms raise (see `ContractPreview`) must
        be listed in `acknowledgments`, or the request is refused with a field
        `acknowledgments` whose message is the notice's code. Every
        acknowledgement is recorded with who gave it and when, and audited.
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "201":
          description: Registered.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts/preview:
    post:
      tags: [Contracts]
      summary: Check terms before registering them
      description: |
        Runs the rules of a creation and stores nothing. Answers the parties
        as they would be saved, the schedule and the notices that need
        acknowledgement. Overlaps and repeated registries are only found on
        creation.
      operationId: previewContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts/{contractID}:
    parameters:
      - name: contractID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    get:
      tags: [Contracts]
      summary: Read a contract
      operationId: getContract
      responses:
        "200":
          description: The contract with its parties, acknowledgements and rents.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Contracts]
      summary: Replace a contract
      description: |
        The whole set of terms as of the version in `If-Match`; the schedule
        is generated again. Refused on `rents` once a rent is paid and on
        `terminated_on` after a termination. Notices acknowledged before still
        count.
      operationId: updateContract
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The `ETag` of the read the edit is based on.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "200":
          description: Replaced.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Contracts]
      summary: Delete a contract
      description: |
        Permanent, with its parties, acknowledgements and rents, audited
        without values. A contract with a paid rent is refused with
        `409 in_use`: terminate it instead.
      operationId: deleteContract
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts/{contractID}/termination:
    parameters:
      - name: contractID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    post:
      tags: [Contracts]
      summary: Terminate a contract
      description: |
        Ends the contract on `terminated_on`, which must fall within its term,
        freeing the property from the next day. Each instalment pays a month
        counted from the start date. The months after the one holding the
        termination are removed; that month, unless the termination falls on
        its last day or it is already paid, is charged for the days the lease
        ran, rounded half up to the centavo. A payment for a later month
        refuses the termination on `terminated_on`. A contract is terminated
        once.
      operationId: terminateContract
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The `ETag` of the read the termination is based on.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminated_on]
              properties:
                terminated_on: { $ref: "#/components/schemas/Date" }
      responses:
        "200":
          description: Terminated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts/{contractID}/amendments/preview:
    parameters:
      - name: contractID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    post:
      tags: [Contracts]
      summary: Check a rent adjustment before recording it
      description: |
        Answers the suggested rent (the current rent times one plus the rate,
        never lower for a negative rate), the rent that would be recorded, the
        first instalment it reaches, how many unpaid instalments change and the
        notices it raises. Records nothing.
      operationId: previewAmendment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendmentInput" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmendmentPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts/{contractID}/amendments:
    parameters:
      - name: contractID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    post:
      tags: [Contracts]
      summary: Adjust the rent from a day on
      description: |
        In one transaction, the contract's `current_rent` and every unpaid
        instalment whose month starts on `amended_on` or later move to the new
        rent; a month already running keeps its rent. `amended_on` falls after
        the start, within the term and after the last adjustment. An
        adjustment less than twelve months after the start or the last one
        raises `adjustment_period` (Lei 10.192/2001, art. 2º, § 1º), which must
        be acknowledged. A paid instalment from that month on refuses it on
        `amended_on`; so does a terminated contract. Once a contract has an
        adjustment, replacing its terms is refused on `amendments`.
      operationId: createAmendment
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The contract's `ETag`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AmendmentInput" }
      responses:
        "201":
          description: Recorded; the contract as it is now.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contracts/{contractID}/amendments/{amendmentID}:
    parameters:
      - name: contractID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
      - name: amendmentID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    delete:
      tags: [Contracts]
      summary: Undo the last adjustment
      description: |
        Puts the previous rent back on the contract and on the unpaid
        instalments the adjustment reached, for a mistake. Refused on
        `amendment` for any adjustment but the last, on a terminated contract,
        or when an instalment it reached is paid. Audited.
      operationId: deleteAmendment
      parameters:
        - name: If-Match
          in: header
          required: true
          description: The contract's `ETag`.
          schema: { type: string }
      responses:
        "200":
          description: Undone; the contract as it is now.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/rents:
    get:
      tags: [Rents]
      summary: Search the office's instalments
      description: |
        Every contract's instalments by due day, paged with `next_cursor`.
        `status` is `overdue` (unpaid and past due), `pending` (unpaid, due
        today or later), `open` (unpaid) or `paid`, computed against today in
        America/Sao_Paulo. `q` matches the contract number, the street or a
        party's name.
      operationId: listRents
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [overdue, pending, open, paid] } }
        - { name: due_from, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: due_to, in: query, schema: { $ref: "#/components/schemas/Date" } }
        - { name: contract_id, in: query, schema: { $ref: "#/components/schemas/ID" } }
        - name: limit
          in: query
          description: Default 50, at most 200.
          schema: { type: integer, minimum: 1 }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page.
          content:
            application/json:
              schema:
                type: object
                required: [rents]
                properties:
                  rents:
                    type: array
                    items: { $ref: "#/components/schemas/RentSummary" }
                  next_cursor: { type: string, description: Absent on the last page. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/rents/{rentID}:
    parameters:
      - name: rentID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    get:
      tags: [Rents]
      summary: Read an instalment
      description: With its charges and, while unpaid, the late fee for paying today.
      operationId: getRent
      responses:
        "200":
          description: The instalment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/rents/{rentID}/payment/preview:
    parameters:
      - name: rentID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    post:
      tags: [Rents]
      summary: Compute the late fee for a payment day
      description: |
        The penalty rate on the rent with its charges, plus the monthly
        interest rate prorated over a thirty-day month for each day after the
        due day, each rounded to the centavo. Paying on or before the due day
        adds nothing. Records nothing.
      operationId: previewPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid_on]
              properties:
                paid_on: { $ref: "#/components/schemas/Date" }
      responses:
        "200":
          description: The late fee and the total.
          content:
            application/json:
              schema:
                type: object
                required: [late_fee, total]
                properties:
                  late_fee: { $ref: "#/components/schemas/LateFee" }
                  total: { $ref: "#/components/schemas/Money" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/rents/{rentID}/payment:
    parameters:
      - name: rentID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    post:
      tags: [Rents]
      summary: Record a payment in full
      description: |
        `late_fee` left out takes the computed one; `amount_paid` left out is
        the rent, its charges and the late fee. `paid_on` is not after today.
        An instalment already paid answers `409 conflict`, which is also what
        the second of two simultaneous payments receives. Audited. There is no
        partial payment.
      operationId: payRent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid_on]
              properties:
                paid_on: { $ref: "#/components/schemas/Date" }
                amount_paid: { $ref: "#/components/schemas/Money", description: What actually came in. }
                late_fee: { $ref: "#/components/schemas/Money", description: The late fee agreed. }
      responses:
        "200":
          description: Paid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentDetail" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [Rents]
      summary: Reverse a payment
      description: Puts the instalment back to unpaid, clearing the amount and the late fee. Refused on `payment` when it is not paid. Audited.
      operationId: reversePayment
      responses:
        "200":
          description: Reversed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/rents/{rentID}/charges:
    parameters:
      - name: rentID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    post:
      tags: [Rents]
      summary: Bill a charge with an unpaid instalment
      description: |
        Condominium, IPTU, water, energy or another charge, which needs a
        description. At most 20 per instalment. Refused on `charges` once the
        instalment is paid. Once any instalment of a contract has a charge,
        replacing the contract's terms is refused on `rents`.
      operationId: addCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount]
              properties:
                kind: { type: string, enum: [condominium, property_tax, water, energy, other] }
                description: { type: string, maxLength: 120 }
                amount: { $ref: "#/components/schemas/Money" }
      responses:
        "201":
          description: Added; the instalment as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/rents/{rentID}/charges/{chargeID}:
    parameters:
      - name: rentID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
      - name: chargeID
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    delete:
      tags: [Rents]
      summary: Remove a charge from an unpaid instalment
      operationId: removeCharge
      responses:
        "200":
          description: Removed; the instalment as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/dashboard:
    get:
      tags: [Rents]
      summary: The office's day at a glance
      description: |
        As of today in America/Sao_Paulo. `month`: every instalment due this
        month (rent and charges), what came in this month whatever the due
        day, what is due this month and unpaid, and the administration fee on
        the rents received this month. `overdue`: every unpaid instalment past
        due. `portfolio`: properties, those with a running contract, running
        contracts and the sum of their current rents. `expiring`: running
        contracts ending within sixty days. `adjustments`: running contracts
        with an index whose twelve months since the start or the last
        adjustment end within thirty days or already ended. `due_today` and
        `overdue_rents` list up to twenty instalments each.
      operationId: getDashboard
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # --- operations -------------------------------------------------------------

  /healthz:
    get:
      tags: [Operations]
      summary: Liveness
      description: Answers while the process serves requests. Checks nothing else.
      operationId: live
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [Operations]
      summary: Readiness
      description: Answers `200` when the database responds within two seconds.
      operationId: ready
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          description: Not ready. The reason is in the log only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  headers:
    ETag:
      description: The record's version, quoted, to send back in `If-Match`.
      schema: { type: string, examples: ['"1"'] }

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA)

  schemas:
    ID:
      type: string
      format: uuid
      examples: ["01923f6e-8b1a-7c3d-9e2f-4a5b6c7d8e9f"]

    Instant:
      type: string
      format: date-time

    Role:
      type: string
      enum: [admin, member]

    NewPassword:
      type: string
      minLength: 12
      maxLength: 256
      description: Length is the only rule. At least 12 characters.

    PasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string }

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, examples: ["492039"] }

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }

    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }

    User:
      type: object
      required: [id, email, name, created_at, totp_enabled]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        email: { type: string }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Instant" }
        totp_enabled: { type: boolean }
        terms_version: { type: string, description: Omitted when empty. }
        terms_accepted_at: { $ref: "#/components/schemas/Instant" }

    Organization:
      type: object
      required: [id, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Instant" }

    Membership:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/Role" }

    Session:
      type: object
      required:
        - user
        - organization
        - role
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - mfa_enrollment_required
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/Role" }
        access_token: { type: string }
        access_expires_at: { $ref: "#/components/schemas/Instant" }
        refresh_token: { type: string }
        refresh_expires_at: { $ref: "#/components/schemas/Instant" }
        mfa_enrollment_required:
          type: boolean
          description: This session may only enrol a second factor and exercise the privacy rights.

    SignInResult:
      type: object
      description: |
        `session` when `mfa_required` is false; `challenge` and
        `challenge_expires_at` when it is true. Never both.
      required: [mfa_required, organizations]
      properties:
        mfa_required: { type: boolean }
        session: { $ref: "#/components/schemas/Session" }
        challenge: { type: string }
        challenge_expires_at: { $ref: "#/components/schemas/Instant" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    Me:
      type: object
      required: [user, organization, role, organizations, mfa_enrollment_required, recovery_codes_left]
      properties:
        user: { $ref: "#/components/schemas/User" }
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/Role" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        mfa_enrollment_required: { type: boolean }
        recovery_codes_left: { type: integer, minimum: 0 }

    Member:
      type: object
      required: [user, role, joined_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { $ref: "#/components/schemas/Instant" }

    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]

    Invitation:
      type: object
      required: [id, email, role, status, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        created_at: { $ref: "#/components/schemas/Instant" }
        expires_at: { $ref: "#/components/schemas/Instant" }

    PendingInvitation:
      type: object
      required: [organization, email, role, account_exists]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        account_exists:
          type: boolean
          description: When true, accepting needs no name or password.

    AccountExport:
      type: object
      required:
        - exported_at
        - account
        - memberships
        - second_factor
        - sessions
        - invitations_received
        - audit_events
        - access_records
      properties:
        exported_at: { $ref: "#/components/schemas/Instant" }
        account:
          type: object
          required: [id, email, name, created_at, updated_at, password_changed_at, terms_version, terms_accepted_at]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            email: { type: string }
            name: { type: string }
            created_at: { $ref: "#/components/schemas/Instant" }
            updated_at: { $ref: "#/components/schemas/Instant" }
            password_changed_at: { type: [string, "null"], format: date-time }
            terms_version: { type: string }
            terms_accepted_at: { type: [string, "null"], format: date-time }
        memberships:
          type: array
          items:
            type: object
            required: [organization, role, joined_at]
            properties:
              organization: { $ref: "#/components/schemas/Organization" }
              role: { $ref: "#/components/schemas/Role" }
              joined_at: { $ref: "#/components/schemas/Instant" }
        second_factor:
          type: object
          required: [enabled, confirmed_at, recovery_codes_left]
          properties:
            enabled: { type: boolean }
            confirmed_at: { type: [string, "null"], format: date-time }
            recovery_codes_left: { type: integer, minimum: 0 }
        sessions:
          type: array
          description: Refresh tokens still stored, without the tokens themselves.
          items:
            type: object
            required: [id, organization_id, created_at, expires_at, used_at, revoked_at]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              organization_id: { $ref: "#/components/schemas/ID" }
              created_at: { $ref: "#/components/schemas/Instant" }
              expires_at: { $ref: "#/components/schemas/Instant" }
              used_at: { type: [string, "null"], format: date-time }
              revoked_at: { type: [string, "null"], format: date-time }
        invitations_received:
          type: array
          items:
            type: object
            required:
              - id
              - organization_id
              - organization_name
              - role
              - status
              - created_at
              - expires_at
              - accepted_at
              - revoked_at
            properties:
              id: { $ref: "#/components/schemas/ID" }
              organization_id: { $ref: "#/components/schemas/ID" }
              organization_name: { type: string }
              role: { $ref: "#/components/schemas/Role" }
              status: { $ref: "#/components/schemas/InvitationStatus" }
              created_at: { $ref: "#/components/schemas/Instant" }
              expires_at: { $ref: "#/components/schemas/Instant" }
              accepted_at: { type: [string, "null"], format: date-time }
              revoked_at: { type: [string, "null"], format: date-time }
        audit_events:
          type: array
          items:
            type: object
            required: [id, organization_id, action, entity_type, entity_id, fields, request_id, ip, occurred_at]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              organization_id: { type: [string, "null"], format: uuid }
              action:
                type: string
                description: Past tense and stable, such as `user.password_changed`.
              entity_type: { type: string }
              entity_id: { type: [string, "null"], format: uuid }
              fields:
                type: array
                description: The names of what changed, never the values.
                items: { type: string }
              request_id: { type: string }
              ip: { type: [string, "null"] }
              occurred_at: { $ref: "#/components/schemas/Instant" }
        access_records:
          type: array
          items:
            type: object
            required: [id, event, ip, port, occurred_at]
            properties:
              id: { $ref: "#/components/schemas/ID" }
              event:
                type: string
                enum: [sign_in, sign_in_refused, refresh, sign_out, account_closed]
              ip: { type: [string, "null"] }
              port: { type: integer }
              occurred_at: { $ref: "#/components/schemas/Instant" }

    PersonKind:
      type: string
      enum: [individual, company]

    Address:
      type: object
      required: [kind, is_primary, street, city, state, zip_code]
      properties:
        id:
          type: string
          format: uuid
          description: In responses only. Addresses are replaced as a list on every edit.
        kind: { type: string, enum: [residential, correspondence, commercial] }
        is_primary: { type: boolean, description: At most one per person. }
        street: { type: string, minLength: 1, maxLength: 120 }
        number: { type: string, maxLength: 20 }
        complement: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 120 }
        state:
          type: string
          description: One of the 27 UFs. Accepted in any case, answered in capitals.
          examples: [SP]
        zip_code:
          type: string
          description: CEP. Accepted formatted, answered as eight digits.
          examples: ["14700000"]
        observation: { type: string, maxLength: 500 }

    PersonInput:
      type: object
      description: |
        Fields of the other kind must be empty. Optional text is sent as `""`
        or left out; `spouse_id` and `birth_date` as `null` or left out.
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/PersonKind" }
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Full name of an individual, legal name of a company.
        email: { type: string }
        phone: { type: string, description: "10 to 13 digits, formatting allowed." }
        cpf: { type: string, description: "Required for individuals, formatted or not, and unique in the office." }
        nationality: { type: string, maxLength: 120 }
        marital_status:
          type: string
          enum: ["", single, married, stable_union, divorced, separated, widowed]
        property_regime:
          type: string
          description: Only with married or stable_union.
          enum: ["", partial_community, universal_community, total_separation, mandatory_separation, final_participation]
        spouse_id: { type: [string, "null"], format: uuid }
        occupation: { type: string, maxLength: 120 }
        birth_date: { type: [string, "null"], format: date }
        gender:
          type: string
          description: "For grammatical agreement in a contract's text only."
          enum: ["", female, male]
        cnpj: { type: string, description: "Companies. Alphanumeric CNPJs are accepted." }
        trade_name: { type: string, maxLength: 200 }
        representative_ids:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        addresses:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Address" }

    Person:
      allOf:
        - $ref: "#/components/schemas/PersonInput"
        - type: object
          required: [id, version, created_at, updated_at, addresses, representative_ids]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            cpf: { type: string, examples: ["529.982.247-25"] }
            cnpj: { type: string, examples: ["12.ABC.345/01DE-35"] }
            version: { type: integer, minimum: 1 }
            created_at: { $ref: "#/components/schemas/Instant" }
            updated_at: { $ref: "#/components/schemas/Instant" }

    PersonSummary:
      type: object
      required: [id, kind, name, trade_name, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        kind: { $ref: "#/components/schemas/PersonKind" }
        name: { type: string }
        trade_name: { type: string }
        created_at: { $ref: "#/components/schemas/Instant" }

    PropertyAddress:
      type: object
      required: [street, city, state, zip_code]
      properties:
        street: { type: string, minLength: 1, maxLength: 120 }
        number: { type: string, maxLength: 20 }
        complement: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 120 }
        state: { type: string, description: "One of the 27 UFs, answered in capitals." }
        zip_code: { type: string, description: "CEP, answered as eight digits." }
        observation: { type: string, maxLength: 500 }

    PropertyInput:
      type: object
      required: [address, owners]
      properties:
        address: { $ref: "#/components/schemas/PropertyAddress" }
        registry: { type: string, maxLength: 60, description: The matrícula at the registry office. }
        registry_office: { type: string, maxLength: 120 }
        municipal_registration: { type: string, maxLength: 60, description: The IPTU registration. }
        water_code: { type: string, maxLength: 60 }
        energy_code: { type: string, maxLength: 60 }
        owners:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [person_id, share]
            properties:
              person_id: { $ref: "#/components/schemas/ID" }
              share:
                type: string
                description: A percentage with up to four decimal places. All shares add up to 100.
                examples: ["50", "33.3333"]

    Property:
      type: object
      required: [id, address, registry, registry_office, municipal_registration, water_code, energy_code, owners, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        address: { $ref: "#/components/schemas/PropertyAddress" }
        registry: { type: string }
        registry_office: { type: string }
        municipal_registration: { type: string }
        water_code: { type: string }
        energy_code: { type: string }
        owners:
          type: array
          items:
            type: object
            required: [person_id, share, name, kind]
            properties:
              person_id: { $ref: "#/components/schemas/ID" }
              share: { type: string, examples: ["50.00", "33.3334"] }
              name: { type: string }
              kind: { $ref: "#/components/schemas/PersonKind" }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Instant" }
        updated_at: { $ref: "#/components/schemas/Instant" }

    PropertySummary:
      type: object
      required: [id, address, registry, owner_names, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        address: { $ref: "#/components/schemas/PropertyAddress" }
        registry: { type: string }
        owner_names: { type: array, items: { type: string } }
        created_at: { $ref: "#/components/schemas/Instant" }

    Date:
      type: string
      format: date
      description: A calendar day, with no time zone.
      examples: ["2026-10-01"]

    Money:
      type: string
      description: Reais with two decimal places, never a number.
      pattern: '^[0-9]+\.[0-9]{2}$'
      examples: ["1500.00"]

    ContractStatus:
      type: string
      enum: [upcoming, active, expired, terminated]

    NoticeCode:
      type: string
      description: |
        `advance_rent`: the office chose rent in advance while there is a
        guarantee (Lei 8.245/91, arts. 20, 42 and 43, III).
        `guarantor_spouse_consent`: a married guarantor, outside total
        separation of property, without the spouse as a party (CC art. 1.647,
        III; Súmula 332 do STJ). `deposit_limit`: a deposit above three rents
        (Lei 8.245/91, art. 38, § 2º).
      enum: [advance_rent, guarantor_spouse_consent, deposit_limit]

    ContractParty:
      type: object
      required: [person_id, role]
      properties:
        person_id: { $ref: "#/components/schemas/ID" }
        role: { type: string, enum: [landlord, tenant, guarantor, guarantor_spouse] }

    ContractInput:
      type: object
      required: [property_id, registry, advance_rent, rent, signed_on, starts_on, expires_on, parties]
      properties:
        property_id: { $ref: "#/components/schemas/ID" }
        registry: { type: string, minLength: 1, maxLength: 60, description: "The office's own number for the contract, unique in the office." }
        guarantee_kind:
          type: string
          enum: [none, deposit, surety, surety_insurance, fund_assignment]
          description: One per contract (art. 37, sole paragraph). Default `none`.
        advance_rent: { type: boolean, description: "Whether each month is paid at its start. The office's choice, with no default." }
        deposit_amount: { $ref: "#/components/schemas/Money", description: Required with `deposit` and refused otherwise. }
        rent: { $ref: "#/components/schemas/Money" }
        admin_fee: { type: string, description: "Percentage, default 10.", examples: ["10"] }
        late_penalty_rate: { type: string, description: "Percentage, default 10.", examples: ["10"] }
        late_interest_rate: { type: string, description: "Percentage a month, default 1.", examples: ["1"] }
        due_day: { type: integer, minimum: 1, maximum: 31, description: Defaults to the day of `signed_on`. }
        adjustment_index: { type: string, enum: [igpm, ipca, inpc, ivar, igpdi] }
        signed_on: { $ref: "#/components/schemas/Date" }
        starts_on: { $ref: "#/components/schemas/Date" }
        expires_on: { $ref: "#/components/schemas/Date", description: "After `starts_on`, at most 50 years later." }
        parties:
          type: array
          maxItems: 20
          description: |
            At least one tenant, and a landlord unless the property's owners
            should be. Guarantors only with `surety`, which needs one; a tenant
            is never a guarantor. Guarantors and their spouses are individuals.
          items: { $ref: "#/components/schemas/ContractParty" }
        acknowledgments:
          type: array
          items: { $ref: "#/components/schemas/NoticeCode" }

    ContractTerms:
      type: object
      required: [property_id, registry, guarantee_kind, advance_rent, deposit_amount, rent, current_rent, admin_fee, late_penalty_rate, late_interest_rate, due_day, adjustment_index, signed_on, starts_on, expires_on, terminated_on, status]
      properties:
        property_id: { $ref: "#/components/schemas/ID" }
        registry: { type: string }
        guarantee_kind: { type: string }
        advance_rent: { type: boolean }
        deposit_amount: { $ref: "#/components/schemas/Money" }
        rent: { $ref: "#/components/schemas/Money" }
        current_rent: { $ref: "#/components/schemas/Money", description: The rent after adjustments. }
        admin_fee: { type: string }
        late_penalty_rate: { type: string }
        late_interest_rate: { type: string }
        due_day: { type: integer }
        adjustment_index: { type: string }
        signed_on: { $ref: "#/components/schemas/Date" }
        starts_on: { $ref: "#/components/schemas/Date" }
        expires_on: { $ref: "#/components/schemas/Date" }
        terminated_on: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        status: { $ref: "#/components/schemas/ContractStatus" }

    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractTerms"
        - type: object
          required: [id, property, parties, acknowledgments, rents, amendments, version, created_at, updated_at]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            property:
              type: object
              required: [id, address]
              properties:
                id: { $ref: "#/components/schemas/ID" }
                address: { $ref: "#/components/schemas/PropertyAddress" }
            parties:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ContractParty"
                  - type: object
                    required: [name, kind]
                    properties:
                      name: { type: string }
                      kind: { $ref: "#/components/schemas/PersonKind" }
            acknowledgments:
              type: array
              items:
                type: object
                required: [code, acknowledged_at]
                properties:
                  code: { $ref: "#/components/schemas/NoticeCode" }
                  acknowledged_at: { $ref: "#/components/schemas/Instant" }
            rents:
              type: array
              items:
                type: object
                required: [id, sequence, due_on, amount, late_fee, amount_paid, paid_on, status]
                properties:
                  id: { $ref: "#/components/schemas/ID" }
                  sequence: { type: integer, minimum: 1 }
                  due_on: { $ref: "#/components/schemas/Date" }
                  amount: { $ref: "#/components/schemas/Money" }
                  charges_total: { $ref: "#/components/schemas/Money" }
                  late_fee: { $ref: "#/components/schemas/Money" }
                  amount_paid: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
                  paid_on: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
                  status:
                    type: string
                    enum: [paid, overdue, pending]
                    description: Computed against today; never stored.
            amendments:
              type: array
              description: Rent adjustments, oldest first.
              items: { $ref: "#/components/schemas/Amendment" }
            version: { type: integer, minimum: 1 }
            created_at: { $ref: "#/components/schemas/Instant" }
            updated_at: { $ref: "#/components/schemas/Instant" }

    AmendmentInput:
      type: object
      required: [amended_on, index_rate]
      properties:
        amended_on: { $ref: "#/components/schemas/Date" }
        index_rate: { type: string, description: "The index's percentage for the period, signed, up to four decimal places.", examples: ["4.5", "-3.1812"] }
        indexed_rent: { $ref: "#/components/schemas/Money", description: The rent agreed. Left out for the suggestion. }
        acknowledgments:
          type: array
          items: { type: string, enum: [adjustment_period] }

    Amendment:
      type: object
      required: [id, amended_on, adjustment_index, index_rate, previous_rent, indexed_rent, period_acknowledged_at, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        amended_on: { $ref: "#/components/schemas/Date" }
        adjustment_index: { type: string, description: "The contract's index when recorded; empty when it has none." }
        index_rate: { type: string, examples: ["4.50"] }
        previous_rent: { $ref: "#/components/schemas/Money" }
        indexed_rent: { $ref: "#/components/schemas/Money" }
        period_acknowledged_at: { oneOf: [{ $ref: "#/components/schemas/Instant" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/Instant" }

    AmendmentPreview:
      type: object
      required: [previous_rent, suggested_rent, indexed_rent, first_sequence, affected_rents, first_due_on, notices]
      properties:
        previous_rent: { $ref: "#/components/schemas/Money" }
        suggested_rent: { $ref: "#/components/schemas/Money" }
        indexed_rent: { $ref: "#/components/schemas/Money" }
        first_sequence: { type: integer, minimum: 1 }
        affected_rents: { type: integer, minimum: 0 }
        first_due_on: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        notices:
          type: array
          items: { type: string, enum: [adjustment_period] }

    LateFee:
      type: object
      required: [days_late, penalty, interest, total]
      properties:
        days_late: { type: integer, minimum: 0 }
        penalty: { $ref: "#/components/schemas/Money" }
        interest: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    RentSummary:
      type: object
      required: [id, contract, sequence, due_on, amount, charges_total, due, late_fee, amount_paid, paid_on, status]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        contract:
          type: object
          required: [id, registry, address, tenant_names]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            registry: { type: string }
            address: { $ref: "#/components/schemas/PropertyAddress" }
            tenant_names: { type: array, items: { type: string } }
        sequence: { type: integer, minimum: 1 }
        due_on: { $ref: "#/components/schemas/Date" }
        amount: { $ref: "#/components/schemas/Money", description: The rent of the instalment. }
        charges_total: { $ref: "#/components/schemas/Money" }
        due: { $ref: "#/components/schemas/Money", description: The rent with its charges. }
        late_fee: { $ref: "#/components/schemas/Money", description: As recorded with the payment; zero while unpaid. }
        amount_paid: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        paid_on: { oneOf: [{ $ref: "#/components/schemas/Date" }, { type: "null" }] }
        status: { type: string, enum: [paid, overdue, pending] }

    RentDetail:
      allOf:
        - $ref: "#/components/schemas/RentSummary"
        - type: object
          required: [charges, suggested_late_fee]
          properties:
            charges:
              type: array
              items:
                type: object
                required: [id, kind, description, amount]
                properties:
                  id: { $ref: "#/components/schemas/ID" }
                  kind: { type: string, enum: [condominium, property_tax, water, energy, other] }
                  description: { type: string }
                  amount: { $ref: "#/components/schemas/Money" }
            suggested_late_fee: { $ref: "#/components/schemas/LateFee" }

    ContractDeadline:
      type: object
      required: [contract_id, registry, address, on]
      properties:
        contract_id: { $ref: "#/components/schemas/ID" }
        registry: { type: string }
        address: { $ref: "#/components/schemas/PropertyAddress" }
        on: { $ref: "#/components/schemas/Date" }

    Dashboard:
      type: object
      required: [today, month_start, month_end, month, overdue, portfolio, expiring, adjustments, due_today, overdue_rents]
      properties:
        today: { $ref: "#/components/schemas/Date" }
        month_start: { $ref: "#/components/schemas/Date" }
        month_end: { $ref: "#/components/schemas/Date" }
        month:
          type: object
          required: [expected, expected_count, received, received_count, open, open_count, office_fee]
          properties:
            expected: { $ref: "#/components/schemas/Money" }
            expected_count: { type: integer }
            received: { $ref: "#/components/schemas/Money" }
            received_count: { type: integer }
            open: { $ref: "#/components/schemas/Money" }
            open_count: { type: integer }
            office_fee: { $ref: "#/components/schemas/Money" }
        overdue:
          type: object
          required: [count, amount]
          properties:
            count: { type: integer }
            amount: { $ref: "#/components/schemas/Money" }
        portfolio:
          type: object
          required: [properties, leased_properties, active_contracts, rent_roll]
          properties:
            properties: { type: integer }
            leased_properties: { type: integer }
            active_contracts: { type: integer }
            rent_roll: { $ref: "#/components/schemas/Money" }
        expiring: { type: array, items: { $ref: "#/components/schemas/ContractDeadline" } }
        adjustments: { type: array, items: { $ref: "#/components/schemas/ContractDeadline" } }
        due_today: { type: array, items: { $ref: "#/components/schemas/RentSummary" } }
        overdue_rents: { type: array, items: { $ref: "#/components/schemas/RentSummary" } }

    ContractSummary:
      allOf:
        - $ref: "#/components/schemas/ContractTerms"
        - type: object
          required: [id, address, tenant_names]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            address: { $ref: "#/components/schemas/PropertyAddress" }
            tenant_names: { type: array, items: { type: string } }

    ContractPreview:
      type: object
      required: [parties, schedule, notices, total]
      properties:
        parties:
          type: array
          items: { $ref: "#/components/schemas/ContractParty" }
        schedule:
          type: array
          items:
            type: object
            required: [sequence, due_on, amount]
            properties:
              sequence: { type: integer, minimum: 1 }
              due_on: { $ref: "#/components/schemas/Date" }
              amount: { $ref: "#/components/schemas/Money" }
        notices:
          type: array
          items: { $ref: "#/components/schemas/NoticeCode" }
        total: { $ref: "#/components/schemas/Money", description: The sum of the schedule. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - validation_failed
                - not_found
                - conflict
                - unauthorized
                - forbidden
                - mfa_required
                - mfa_enrollment_required
                - rate_limited
                - bad_request
                - unsupported_media_type
                - payload_too_large
                - internal_error
                - unavailable
                - precondition_failed
                - precondition_required
                - in_use
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

  responses:
    BadRequest:
      description: The body could not be read, or is larger than 1 MiB (`413`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Authentication failed. One answer for a missing or refused token, a
        wrong password or code, and a spent or unknown link.
      headers:
        WWW-Authenticate:
          description: Sent when the bearer token was missing or refused.
          schema: { type: string, examples: ["Bearer"] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `forbidden`: the caller may not do this, or does not belong to the
        office. `mfa_enrollment_required`: the session must enrol a second
        factor first.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource in this office.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        The request conflicts with the current state. `in_use` when a delete is
        refused because other records still link to the resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: The resource changed since it was read. Read it again and redo the edit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionRequired:
      description: Send `If-Match` with the version being edited.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: The body must be `application/json`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: The request was read and refused. `fields` lists every problem.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          description: Whole seconds to wait.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
