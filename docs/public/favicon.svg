<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Imobiliary Docs">
  <!--
    The "d" of docs, in the subapplication amber.

    The outline is the real Fustat glyph at weight 600 — the same weight the
    wordmark uses — taken from the variable font the platform ships
    (@fontsource-variable/fustat, SIL Open Font License), instanced at wght=600
    with fontTools and converted to a path. It is a path rather than a <text>
    element because a favicon renders without the page's fonts: Fustat would
    silently fall back to whatever each machine happens to have, and the mark
    would differ from one computer to the next.

    Glyph units are 1000 per em with the baseline at y=0 and y pointing up, so
    the transform flips the axis, scales the glyph to 20px tall and centres its
    bounding box in the square. Coordinates are rounded to one decimal, which
    at this scale is under three hundredths of a pixel.

    The outline keeps the variable font's overlap: the stem is its own contour
    crossing the bowl. Both wind the same way and the counter the other, so the
    default nonzero fill draws it as one shape.

    The dark ground is deliberate. A bare amber glyph would disappear against a
    light tab bar; the square keeps the contrast the same everywhere.

    The amber is written as a hex rather than as the design token's
    oklch(0.66 0.12 58), which is the same colour in sRGB. A favicon is drawn
    by a far more constrained renderer than the page, and a colour it cannot
    parse falls back to black — which on this ground means an invisible mark.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0d10"/>
  <g transform="translate(8.19 25.63) scale(0.0268 -0.0268)" fill="#c87e41">
    <path d="M278.1 -13.7Q210.8 -13.7 156.3 20.5Q101.7 54.7 69.8 114.4Q37.9 174 37.9 251.3Q37.9 328.9 69.8 388.8Q101.7 448.6 156.3 482.8Q210.8 517 278.1 517Q332 517 375.8 495Q419.7 473.1 449.8 436.6Q480 400.1 492.9 354.3V148.2Q480 103.4 449.8 66.6Q419.7 29.8 375.8 8.1Q332 -13.7 278.1 -13.7ZM289.8 78.9Q336.1 78.9 371 100.8Q406 122.8 426.2 161.7Q446.4 200.7 446.4 251.7Q446.4 303.1 426.2 341.8Q406 380.6 371 402.5Q336.1 424.4 289.8 424.4Q245.8 424.4 211.2 402.5Q176.6 380.6 157.3 341.8Q137.9 303.1 137.9 251.7Q137.9 200.7 157.3 161.7Q176.6 122.8 211.2 100.8Q245.8 78.9 289.8 78.9ZM450.1 0V167.8L469.6 251.7L444.7 335.5V720L541.8 731.9L544.8 723.9V0Z"/>
  </g>
</svg>
